}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;div class=&quot;evidence-grid&quot;&gt;
    &lt;section&gt;&lt;h3&gt;碎片化最强的维度&lt;/h3&gt;&lt;ol&gt;&lt;li&gt;&lt;strong&gt;Period × Shade&lt;/strong&gt;：移动边界迫使静态 Patch 预拆。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Depth × Grass × Shade&lt;/strong&gt;：三套边界互不对齐，形成典型交叉切割。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Temperature / DO&lt;/strong&gt;：连续场被离散阈值化后产生新轮廓。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Functional tags&lt;/strong&gt;：玩法语义区域常跨越物理区。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;小型 Structure&lt;/strong&gt;：局部对象少，但边界密、易受地图改动影响。&lt;/li&gt;&lt;/ol&gt;&lt;/section&gt;
    &lt;section&gt;&lt;h3&gt;工具可缓解&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;自动叠加切割、批量赋值、相邻同值检测&lt;/li&gt;&lt;li&gt;来源 Layer 可视化、冲突高亮、影响范围预览&lt;/li&gt;&lt;li&gt;参数继承、模板、稳定 ID、差异与回归检查&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;
    &lt;section&gt;&lt;h3&gt;结构性成本&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;动态连续场与静态边界的语义错配&lt;/li&gt;&lt;li&gt;组合数量随独立边界交叉而增长&lt;/li&gt;&lt;li&gt;“可合并”取决于所有下游消费者是否等价&lt;/li&gt;&lt;li&gt;时间变化需要多套状态或更细的预切分&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;
  &lt;/div&gt;
  &lt;p class=&quot;footnote text-small text-muted&quot;&gt;证据定位：本实验只展示 Manual Region Proposal 的作者成本压力；Patch 数量是同一假想湖泊上的一致性估算，不构成 Manual / Procedural / Runtime Query 的取舍结论。&lt;/p&gt;

&lt;script&gt;
(() =&gt; {
const root=document.getElementById(&#x27;ogre-lake-exp&#x27;);
const data=[
{n:&#x27;0 · 基础水域 Geometry&#x27;,r:1,p:1,b:&#x27;湖岸线；单一水体范围。&#x27;,s:&#x27;无；湖泊仍是一个 Region。&#x27;,m:&#x27;无。&#x27;,a:&#x27;湖岸轮廓、湖面 ID、基础元数据。&#x27;,e:&#x27;岸线变化只改 1 个水域边界。&#x27;,cause:&#x27;湖岸&#x27;},
{n:&#x27;1 · Depth&#x27;,r:4,p:6,b:&#x27;浅滩、两级 drop-off、深坑等深边界。&#x27;,s:&#x27;基础水体按深度带拆分；深坑形成内嵌区。&#x27;,m:&#x27;相邻且深度分级相同、无其他差异的带段可合并。&#x27;,a:&#x27;深度阈值、等深线、深坑/断层命名与属性。&#x27;,e:&#x27;地形刷动会影响相邻 2–4 个深度 Patch。&#x27;,cause:&#x27;等深线与深坑&#x27;},
{n:&#x27;2 · Vegetation / Grass&#x27;,r:8,p:14,b:&#x27;草区外缘、草边缓冲、浮萍/间植斑块。&#x27;,s:&#x27;浅水带和第一断层被草区穿过；草边两侧分别拆。&#x27;,m:&#x27;被深度线切开但属性完全相同的连续草段，可逻辑合并。&#x27;,a:&#x27;植被类型、密度、草边宽度、季节开关。&#x27;,e:&#x27;草区轮廓调整会重编其穿过的约 4–7 个 Patch。&#x27;,cause:&#x27;草区跨越深度带&#x27;},
{n:&#x27;3 · Rock / Wood / Dock Structure&#x27;,r:12,p:20,b:&#x27;石区轮廓、沉木影响圈、桥墩局部结构边界。&#x27;,s:&#x27;浅滩、开放水面及草边附近 Patch 被局部对象切开。&#x27;,m:&#x27;多个同类桥墩可共享参数，但空间 Patch 仍需独立定位。&#x27;,a:&#x27;对象范围、影响半径、结构类型、可用/损坏状态。&#x27;,e:&#x27;移动沉木或桥墩会重编邻近 2–5 个小 Patch。&#x27;,cause:&#x27;小而密的结构对象&#x27;},
{n:&#x27;4 · Substrate&#x27;,r:16,p:27,b:&#x27;泥/沙、砾石/硬底的过渡轮廓。&#x27;,s:&#x27;底质边界斜穿深度带、草区和结构区。&#x27;,m:&#x27;非相邻同值区只能共享参数，不能空间合并。&#x27;,a:&#x27;底质分类、混合比例、过渡带、采样依据。&#x27;,e:&#x27;重刷底材会波及一条带上的约 5–8 个 Patch。&#x27;,cause:&#x27;斜穿既有边界&#x27;},
{n:&#x27;5 · Light / Shade&#x27;,r:21,p:38,b:&#x27;局部阴影边界；Morning 与 Afternoon 的投影方向不同。&#x27;,s:&#x27;同一草区被阴影边缘切成“晨阴/午阴/都阴/都不阴”稳定子区。&#x27;,m:&#x27;只在所选时段相同还不够；必须所有受支持时段等价才可合并。&#x27;,a:&#x27;遮挡源、各时段阴影状态、更新规则、例外覆盖。&#x27;,e:&#x27;移动树冠/桥面会重编阴影扫过的约 8–13 个 Patch。&#x27;,cause:&#x27;移动阴影 × 草区&#x27;},
{n:&#x27;6 · Temperature&#x27;,r:26,p:49,b:&#x27;暖水舌/冷水区的阈值轮廓，与等深线不完全重合。&#x27;,s:&#x27;开放水、深坑、草边及阴影子区再次被阈值线穿过。&#x27;,m:&#x27;温度落入同一响应桶且其他属性相同者可合并；连续值本身难合并。&#x27;,a:&#x27;阈值、时间窗口、插值来源、异常覆盖与季节版本。&#x27;,e:&#x27;温度轮廓偏移 10–20m 可能重编约 9–15 个 Patch。&#x27;,cause:&#x27;连续场阈值化&#x27;},
{n:&#x27;7 · DO&#x27;,r:31,p:61,b:&#x27;低溶氧舌从深坑侧侵入，与温度、深度轮廓错位。&#x27;,s:&#x27;深坑、深水带、沉木区及部分暖水 Patch 被再次切开。&#x27;,m:&#x27;DO 桶相同不代表可合并，还需温度/深度/结构全部一致。&#x27;,a:&#x27;DO 阈值、低氧区轮廓、昼夜/季节版本、缺测处理。&#x27;,e:&#x27;低氧边界变化会连带约 10–17 个 Patch。&#x27;,cause:&#x27;DO × Temp 错位&#x27;},
{n:&#x27;8 · Flow（局部）&#x27;,r:33,p:65,b:&#x27;入/出水口附近窄流带和方向边界。&#x27;,s:&#x27;东侧开放水及桥墩邻域少量拆分。&#x27;,m:&#x27;流速档相同的相邻段可合并，方向不同则通常不能。&#x27;,a:&#x27;流向、流速档、作用宽度、事件开关。&#x27;,e:&#x27;入水口调整主要影响约 3–6 个局部 Patch。&#x27;,cause:&#x27;局部窄带&#x27;},
{n:&#x27;9 · Spawn / Functional tags&#x27;,r:39,p:78,b:&#x27;产卵场、nursery、伏击位等玩法语义轮廓。&#x27;,s:&#x27;语义区跨过多种物理 Patch，覆盖区与非覆盖区必须拆开。&#x27;,m:&#x27;若 Tag 是可叠加集合而非独占类型，可减少物理 merge 需求。&#x27;,a:&#x27;Tag 集合、物种/季节适用性、优先级、验证注释。&#x27;,e:&#x27;功能区扩缩会重编其周边约 8–14 个 Patch。&#x27;,cause:&#x27;语义区跨物理区&#x27;},
{n:&#x27;10 · Period change&#x27;,r:45,p:96,b:&#x27;Morning / Afternoon / Dusk 的状态组合边界。&#x27;,s:&#x27;预先拆出在任一时段会改变 Shade、Temp、DO 或功能状态的稳定子区。&#x27;,m:&#x27;只有全时段状态向量相同的相邻 Patch 才能合并。&#x27;,a:&#x27;每个 Patch 的时段状态表、切换条件、季节版本、覆盖优先级。&#x27;,e:&#x27;任一时段边界移动都可能触发 12–22 个 Patch 的级联重编。&#x27;,cause:&#x27;多时段状态向量&#x27;}];
let step=0,period=&#x27;morning&#x27;;
const sel=root.querySelector(&#x27;#layerSelect&#x27;); data.forEach((d,i)=&gt;{const o=document.createElement(&#x27;option&#x27;);o.value=i;o.textContent=d.n;sel.appendChild(o)});
function cuts(count){const g=root.querySelector(&#x27;#cuts&#x27;);g.innerHTML=&#x27;&#x27;;if(count&lt;2)return;const lines=Math.min(16,Math.ceil(Math.sqrt(count))*2);for(let i=0;i&lt;lines;i++){const x=70+(i*73)%570;const y1=65+(i*41)%330;const y2=Math.min(455,y1+90+(i%4)*38);const l=document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;,&#x27;path&#x27;);l.setAttribute(&#x27;class&#x27;,&#x27;cut&#x27;);l.setAttribute(&#x27;d&#x27;,`M${x},${y1} C${x+35},${y1+20} ${x-28},${y2-25} ${x+12},${y2}`);g.appendChild(l)}}
function update(){const d=data[step],prev=step?data[step-1].p:0;sel.value=step;root.querySelector(&#x27;#meaningful&#x27;).textContent=d.r;root.querySelector(&#x27;#patches&#x27;).textContent=d.p;root.querySelector(&#x27;#delta&#x27;).textContent=&#x27;+&#x27;+(d.p-prev);root.querySelector(&#x27;#layerTitle&#x27;).textContent=d.n;[&#x27;boundaries&#x27;,&#x27;splits&#x27;,&#x27;merges&#x27;,&#x27;maintain&#x27;,&#x27;reedit&#x27;].forEach((id,i)=&gt;root.querySelector(&#x27;#&#x27;+id).textContent=d[[&#x27;b&#x27;,&#x27;s&#x27;,&#x27;m&#x27;,&#x27;a&#x27;,&#x27;e&#x27;][i]]);root.querySelectorAll(&#x27;.layer[data-layer]&#x27;).forEach(el=&gt;el.classList.toggle(&#x27;visible&#x27;,+el.dataset.layer&lt;=step));root.querySelector(&#x27;#periodControls&#x27;).style.display=step&gt;=5?&#x27;flex&#x27;:&#x27;none&#x27;;cuts(d.p);root.querySelector(&#x27;#prevLayer&#x27;).disabled=step===0;root.querySelector(&#x27;#nextLayer&#x27;).disabled=step===data.length-1;drawChart()}

function drawChart(){const svg=root.querySelector(&#x27;#growthChart&#x27;),W=720,H=230,m={l:42,r:22,t:18,b:58},max=100;let s=`&lt;line class=&quot;chart-axis&quot; x1=&quot;${m.l}&quot; y1=&quot;${H-m.b}&quot; x2=&quot;${W-m.r}&quot; y2=&quot;${H-m.b}&quot;/&gt;&lt;line class=&quot;chart-axis&quot; x1=&quot;${m.l}&quot; y1=&quot;${m.t}&quot; x2=&quot;${m.l}&quot; y2=&quot;${H-m.b}&quot;/&gt;`;const pts=data.map((d,i)=&gt;[m.l+i*(W-m.l-m.r)/(data.length-1),H-m.b-d.p/max*(H-m.t-m.b)]);s+=`&lt;path class=&quot;chart-line&quot; d=&quot;M${pts.map(p=&gt;p.join(&#x27;,&#x27;)).join(&#x27; L&#x27;)}&quot;/&gt;`;pts.forEach((p,i)=&gt;{s+=`&lt;circle class=&quot;chart-dot&quot; cx=&quot;${p[0]}&quot; cy=&quot;${p[1]}&quot; r=&quot;${i===step?6:4}&quot;/&gt;&lt;text class=&quot;chart-label&quot; x=&quot;${p[0]}&quot; y=&quot;${p[1]-10}&quot; text-anchor=&quot;middle&quot;&gt;${data[i].p}&lt;/text&gt;&lt;text class=&quot;chart-label&quot; x=&quot;${p[0]}&quot; y=&quot;${H-m.b+20}&quot; text-anchor=&quot;middle&quot;&gt;L${i}&lt;/text&gt;`});[0,50,100].forEach(v=&gt;{const y=H-m.b-v/max*(H-m.t-m.b);s+=`&lt;text class=&quot;chart-label&quot; x=&quot;${m.l-8}&quot; y=&quot;${y+4}&quot; text-anchor=&quot;end&quot;&gt;${v}&lt;/text&gt;`});svg.innerHTML=s}

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
