<!doctype html><meta charset="utf-8"><title>FCF Authoring Editor Current Contract</title>
<style>body{font:14px system-ui;margin:0;background:#f4f6f8;color:#17202a}header{padding:18px 28px;background:#16324f;color:white}main{display:grid;grid-template-columns:220px 1fr 360px;gap:16px;padding:18px}nav,section,aside{background:white;border:1px solid #d7dde5;border-radius:8px;padding:14px}button{margin:4px;padding:7px 10px;border:1px solid #9aaabd;border-radius:5px;background:#fff;cursor:pointer}.active{background:#dceeff}.ok{color:#087f46}.bad{color:#b42318}.code{white-space:pre-wrap;background:#f7f8fa;padding:10px;border-radius:5px;font-family:ui-monospace;font-size:12px}label{display:block;margin:10px 0}input,select{padding:6px;width:90%}.pill{display:inline-block;background:#edf2f7;padding:3px 7px;border-radius:10px;margin:2px}</style>
<header><h1>FCF Authoring Editor <small>Current Contract fixture</small></h1><div>Species → FishQuality → Engagement Mode Routing → independent Surface Programs</div></header>
<main><nav><h3>Species</h3><button class=active>Largemouth Bass</button><h3>Workspaces</h3><button onclick="show('species')">Species</button><button onclick="show('quality')">FishQuality</button><button onclick="show('routing')">Engagement Mode Routing</button><button onclick="show('mode')">Engagement Mode</button><button onclick="show('programs')">Surface Programs</button></nav>
<section id=content><h2>Overview</h2><div id=workspace></div></section>
<aside><h3>Draft status</h3><div id=status>Loading…</div><button onclick="validate()">Lint & Compile</button><button onclick="save()">Save valid draft</button><h3>Effective / Compiled Preview</h3><div id=preview class=code>—</div><h3>Affected Objects</h3><div id=affected>Bass · Q1–Q5 · NORMAL · ACTIVE_SPAWNING · SPAWN_GUARD</div></aside></main>
<script>
let saved,draft; const $=id=>document.getElementById(id); const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;');
fetch('/api/config').then(r=>r.json()).then(x=>{saved=x;draft=structuredClone(x); render()});
function render(){ $('status').innerHTML='<span class=ok>✓ Saved Source loaded · Working Draft clean</span>'; $('workspace').innerHTML=`<h3>Species Shared Config</h3><label>FeedingReadiness<select onchange="draft.species.slow_facts.FeedingReadiness=this.value;dirty()"><option>NORMAL</option><option ${draft.species.slow_facts.FeedingReadiness==='LOW'?'selected':''}>LOW</option><option>HIGH</option></select></label><p>DefaultEngagementModeRef: <b>${draft.species.default_engagement_mode_ref}</b></p><p>EngagementModeRoutingProgramRef: <b>${draft.species.engagement_mode_routing_program_ref}</b></p><h3>FishQuality</h3>${draft.fish_qualities.map(x=>`<span class=pill>${x.id}: base ${x.base_weight}</span>`).join('')}<h3>Engagement Modes</h3>${draft.species.engagement_modes.map(x=>`<span class=pill>${x.id}</span>`).join('')}` }
function dirty(){ $('status').innerHTML='<span>● Working Draft changed (not compiled)</span>'; }
function show(kind){ if(kind==='quality') $('workspace').innerHTML='<h2>FishQuality</h2><div class=code>'+esc(JSON.stringify(draft.fish_qualities,null,2))+'</div>'; else if(kind==='routing') $('workspace').innerHTML='<h2>Engagement Mode Routing</h2><p>Special shares are authored per FishQuality bucket; Default is derived remainder.</p><div class=code>'+esc(JSON.stringify(draft.engagement_mode_routing,null,2))+'</div>'; else if(kind==='mode') $('workspace').innerHTML='<h2>Engagement Mode</h2><p>Each Mode independently binds Bake / Response / Quality Selection programs.</p><div class=code>'+esc(JSON.stringify(draft.species.engagement_modes,null,2))+'</div>'; else if(kind==='programs') $('workspace').innerHTML='<h2>Surface Programs</h2><div class=code>'+esc(JSON.stringify(draft.surface_programs,null,2))+'</div>'; else render() }
function validate(){ fetch('/api/validate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(draft)}).then(r=>r.json()).then(x=>{if(x.valid){$('status').innerHTML='<span class=ok>✓ Valid · Compiled</span>';$('preview').textContent=JSON.stringify(x.effective,null,2)}else{$('status').innerHTML='<span class=bad>✕ '+x.errors.join('<br>✕ ')+'</span>';}})}
function save(){fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(draft)}).then(r=>r.json()).then(x=>{if(x.saved){saved=structuredClone(draft);$('status').innerHTML='<span class=ok>✓ Saved Source updated</span>'}else $('status').innerHTML='<span class=bad>✕ '+x.errors.join('<br>')+'</span>'})}
</script>
